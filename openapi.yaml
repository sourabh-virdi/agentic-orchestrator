openapi: 3.1.0
info:
  title: Agentic Orchestrator API
  description: |
    REST API for the Agentic Orchestrator — submit strategic goals and monitor
    their decomposition into task graphs executed by specialized subagents.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.orchestrator.example.com
    description: Production

paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [System]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/goals:
    post:
      summary: Submit a new goal
      operationId: submitGoal
      tags: [Goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
            example:
              title: "Q2 Email Engagement Campaign"
              description: "Increase email open rates by 20% for enterprise segment"
              constraints:
                budget_usd: 5000
                deadline: "2026-06-30"
                channels: ["email", "in-app"]
                audience: "enterprise"
      responses:
        '202':
          description: Goal accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'

  /api/v1/goals/{goalId}:
    get:
      summary: Get goal status
      operationId: getGoal
      tags: [Goals]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '404':
          description: Goal not found

  /api/v1/goals/{goalId}/tasks:
    get:
      summary: List tasks for a goal
      operationId: getGoalTasks
      tags: [Goals]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'

  /api/v1/goals/{goalId}/audit:
    get:
      summary: Get audit trail for a goal
      operationId: getGoalAudit
      tags: [Audit]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'

  /api/v1/goals/{goalId}/cancel:
    post:
      summary: Cancel a running goal
      operationId: cancelGoal
      tags: [Goals]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Goal cancelled
        '404':
          description: Goal not found

  /api/v1/simulate:
    post:
      summary: Run a goal through the deterministic simulator
      operationId: simulateGoal
      tags: [Simulator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
      responses:
        '200':
          description: Simulation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'

  /api/v1/replay/{goalId}:
    get:
      summary: Get replay data for the UI
      operationId: getReplayData
      tags: [Replay]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Replay data including DAG and timeline

  /api/v1/metrics:
    get:
      summary: Prometheus metrics endpoint
      operationId: getMetrics
      tags: [System]
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    GoalCreate:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          minLength: 1
          maxLength: 5000
        constraints:
          $ref: '#/components/schemas/GoalConstraints'

    GoalConstraints:
      type: object
      properties:
        budget_usd:
          type: number
          nullable: true
        deadline:
          type: string
          nullable: true
        channels:
          type: array
          items:
            type: string
        audience:
          type: string
          nullable: true

    GoalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, planning, executing, completed, failed, cancelled]
        task_count:
          type: integer
        created_at:
          type: string
          format: date-time

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        agent_type:
          type: string
          enum: [planner, retriever, executor, verifier]
        status:
          type: string
          enum: [pending, running, completed, failed, skipped]
        dependencies:
          type: array
          items:
            type: string
            format: uuid
        result:
          type: object
          nullable: true
        retries:
          type: integer
        created_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent:
          type: string
        action:
          type: string
        payload:
          type: object
        timestamp:
          type: string
          format: date-time

    SimulateRequest:
      type: object
      required: [goal]
      properties:
        goal:
          $ref: '#/components/schemas/GoalCreate'
        seed:
          type: integer
          default: 42
        failure_rate:
          type: number
          default: 0.1

    SimulationResult:
      type: object
      properties:
        goal_id:
          type: string
          format: uuid
        steps:
          type: integer
        total_reward:
          type: number
        trace:
          type: array
          items:
            type: object
        dag:
          type: object

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        services:
          type: object
