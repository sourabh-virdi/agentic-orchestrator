global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: "agentic-orchestrator"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "orchestrator-api"
          environment: "dev"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
