replicaCount: 2

image:
  repository: sourabh-virdi/agentic-orchestrator
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: orchestrator.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: orchestrator-tls
      hosts:
        - orchestrator.example.com

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: true
  auth:
    database: orchestrator
    username: orchestrator
    existingSecret: orchestrator-db-secret

redis:
  enabled: true
  auth:
    enabled: false

chromadb:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi

env:
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: agentic-orchestrator

secrets:
  existingSecret: orchestrator-secrets

probes:
  liveness:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /api/v1/metrics
